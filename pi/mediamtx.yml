# MediaMTX config per Emiglio (Raspberry Pi Zero 2 W)
# Path "emiglio": webcam USB + mic ReSpeaker  -> Pi pubblica, tutti leggono
# Path "voice":   voce dal PC/browser         -> Pi la riproduce sullo speaker ReSpeaker

logLevel: info

# Robustezza su Wi-Fi ballerino: le sessioni morte vengono chiuse in 6 s invece di 10 (cosi' chi si
# ricollega non trova il path ancora "occupato"), e la coda di scrittura verso i lettori e' piu'
# profonda per assorbire i cali di banda senza buttarli fuori.
readTimeout: 6s
writeTimeout: 6s
writeQueueSize: 2048

rtsp: yes
rtspAddress: :8554

hls: no
srt: no
rtmp: no
moq: no

webrtc: yes
webrtcAddress: :8889
# HTTPS obbligatorio: il browser nega getUserMedia (microfono) su origini http non-localhost.
webrtcEncryption: yes
webrtcServerKey: /etc/mediamtx/server.key
webrtcServerCert: /etc/mediamtx/server.crt
# Aggiungi qui l'IP LAN del Pi se ICE non trova candidati (es. "192.168.1.50")
webrtcAdditionalHosts: []

paths:
  emiglio:
    # GStreamer manda MPEG-TS su UDP locale (vedi publish-gst.sh)
    source: udp://127.0.0.1:5004
    runOnInit: /opt/emiglio/publish.sh
    runOnInitRestart: yes

  voice:
    source: publisher
    # Un solo publisher alla volta: un secondo tentativo viene rifiutato invece di buttare fuori il primo
    overridePublisher: no
    # Parte solo quando qualcuno sta pubblicando su "voice", muore quando smette
    runOnAvailable: /opt/emiglio/play-voice.sh
    runOnAvailableRestart: yes
